name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: List JAR files
        if: always()
        run: |
          echo "Files in build/libs:"
          ls -lah build/libs || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OverworldPlus-1.21.10-v0.32.3
          path: build/libs/*.jar
          if-no-files-found: error
