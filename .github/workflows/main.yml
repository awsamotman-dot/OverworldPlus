name: Build Overworld Plus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. Find the real Gradle project
      # =========================
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/build.gradle" ] || [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project was found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Found project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================
      # 3. Setup Java 21
      # IMPORTANT:
      # No Gradle cache here.
      # =========================
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: ''

      # =========================
      # 4. Verify Java
      # =========================
      - name: Verify Java
        shell: bash
        run: |
          set -e

          java -version
          javac -version

      # =========================
      # 5. Setup Gradle
      # Cache disabled intentionally
      # =========================
      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
          cache-disabled: true

      # =========================
      # 6. Verify project
      # =========================
      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            | sort

      # =========================
      # 7. Java source sanity check
      # =========================
      - name: Check Java source files
        shell: bash
        run: |
          set -e

          JAVA_DIR="$PROJECT_DIR/src/main/java"

          if [ ! -d "$JAVA_DIR" ]; then
            echo "ERROR: Java source directory not found:"
            echo "$JAVA_DIR"
            exit 1
          fi

          echo "Checking Java files..."

          COUNT=0

          while IFS= read -r file; do
            COUNT=$((COUNT + 1))

            if [ ! -s "$file" ]; then
              echo "ERROR: Empty Java file:"
              echo "$file"
              exit 1
            fi

          done < <(find "$JAVA_DIR" -type f -name "*.java" | sort)

          echo "Checked $COUNT Java files."

      # =========================
      # 8. Gradle clean
      # =========================
      - name: Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      # =========================
      # 9. Build
      # =========================
      - name: Build mod
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Overworld Plus..."
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Starting build..."

          gradle build \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================
      # 10. Find generated JAR
      # =========================
      - name: Find built JAR
        if: success()
        shell: bash
        run: |
          set -e

          echo "Searching for JAR files..."

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/libs/*.jar" \
            -print

          JAR_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/libs/*.jar" \
            | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "ERROR: No JAR was generated."
            exit 1
          fi

      # =========================
      # 11. Upload mod
      # =========================
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OverworldPlus-1.21.10
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 30
