name: Build Overworld Plus

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract mod project
        run: |
          mkdir project
          unzip -q OverworldPlus_1.21.10_v0.32.0_2000Upgrades.zip -d project

      - name: Find Gradle project
        run: |
          echo "Searching for build.gradle..."
          find project -name "build.gradle" -print
          find project -name "gradlew" -print

      - name: Build mod
        run: |
          PROJECT_DIR=$(dirname "$(find project -name build.gradle -print -quit)")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Overworld-Plus-JAR
          path: |
            project/**/build/libs/*.jar
          if-no-files-found: error
