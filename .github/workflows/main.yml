name: Build Overworld Plus

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
          cache-disabled: true

      - name: Find mod ZIP
        shell: bash
        run: |
          set -e

          ZIP="OverworldPlus_1.21.10_v0.32.1_FixedBuild.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Mod ZIP not found!"
            echo "Files in repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found mod archive:"
          ls -lh "$ZIP"

      - name: Extract mod project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "OverworldPlus_1.21.10_v0.32.1_FixedBuild.zip" -d project

          echo "Searching for build.gradle..."

          BUILD_FILE=$(find project -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle was not found!"
            echo "Extracted files:"
            find project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Build file:"
          echo "$BUILD_FILE"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "Overworld Plus project"
          echo "================================"

          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

      - name: Build mod
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "BUILDING OVERWORLD PLUS"
          echo "Minecraft: 1.21.10"
          echo "Java: 21"
          echo "Gradle: 8.14.4"
          echo "================================"

          gradle clean build \
            --no-daemon \
            --stacktrace

      - name: Find JAR
        shell: bash
        run: |
          set -e

          echo "Searching for generated JAR..."

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            -print

          JAR=$(find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR was generated!"
            find "$PROJECT_DIR/build" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Generated JAR:"
          echo "$JAR"

          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OverworldPlus-1.21.10
          path: ${{ env.JAR }}
          if-no-files-found: error
