name: Build Overworld Plus

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Find mod ZIP
        shell: bash
        run: |
          set -e

          ZIP="OverworldPlus_1.21.10_v0.32.1_FixedBuild.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Mod ZIP not found:"
            echo "$ZIP"
            echo ""
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP"

      - name: Extract mod project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "OverworldPlus_1.21.10_v0.32.1_FixedBuild.zip" -d project

          echo "Searching for build.gradle..."

          BUILD_FILE=$(find project -type f -name "build.gradle" -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle was not found!"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "BUILD_FILE=$BUILD_FILE"
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Minecraft project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Java version:"
          java -version

      - name: Build mod
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Overworld Plus"
          echo "Minecraft: 1.21.10"
          echo "Java: 21"
          echo "Gradle: 8.14.4"
          echo "======================================"

          gradle clean build \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find built JAR
        shell: bash
        run: |
          set -e

          echo "Searching for generated JAR..."

          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            -print

          JAR=$(find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: No mod JAR was generated!"
            echo ""
            echo "Build directory:"
            find "$PROJECT_DIR/build" -maxdepth 3 -type f -print
            exit 1
          fi

          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "Generated JAR:"
          echo "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OverworldPlus-1.21.10
          path: ${{ env.JAR }}
          if-no-files-found: error
