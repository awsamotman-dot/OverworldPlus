name: Build Overworld Plus

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build JAR
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show generated JARs
        if: always()
        run: |
          echo "Generated JAR files:"
          find build/libs -maxdepth 1 -type f -name "*.jar" -print || true

      - name: Upload Mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OverworldPlus-1.21.10-v0.32.3
          path: build/libs/*.jar
          if-no-files-found: erro
