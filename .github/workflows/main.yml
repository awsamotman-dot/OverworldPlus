name: Build Overworld Plus

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
          cache-provider: basic

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find . -type f -name 'build.gradle' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: build.gradle was not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Repair known source errors
        run: |
          python3 tools/fix_build.py "$PROJECT_DIR"

      - name: Validate Java source
        run: |
          python3 tools/validate_java.py "$PROJECT_DIR/src/main/java"

      - name: Build mod
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle clean build \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OverworldPlus-1.21.10
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
